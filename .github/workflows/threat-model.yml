name: Threat Model Sync & Risk Analysis (Hybrid STRIDE)
on:
  workflow_run:
    workflows: ["Normalize & Enrich DefectDojo Findings (EPSS, KEV & Links)"]
    types:
      - completed
  push:
    paths:
      - 'threat-model.*'
      - 'threat-model/**'
  workflow_dispatch:

jobs:
  threat-model-sync:
    name: Hybrid STRIDE Threat Model & NIS2 Risk Sync (node-goat)
    if: github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Evaluate Threat Model & Roll Up Architectural Risks
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          REPO_NAME: node-goat
        run: |
          python3 - << 'EOF'
          import json
          import os
          import urllib.request

          dd_url = os.environ["DD_URL"].rstrip("/")
          dd_token = os.environ["DD_TOKEN"]
          repo_name = os.environ["REPO_NAME"]

          # 1. Detect any developer-created threat model files
          supported_exts = (".json", ".drawio", ".md", ".png", ".jpg", ".jpeg", ".svg", ".pdf")
          developer_tm_files = []

          for entry in os.listdir("."):
              if os.path.isfile(entry) and entry.lower().startswith("threat-model.") and entry.lower().endswith(supported_exts):
                  developer_tm_files.append(entry)

          if os.path.isdir("threat-model"):
              for root, _, files in os.walk("threat-model"):
                  for fname in files:
                      if fname.lower().endswith(supported_exts):
                          developer_tm_files.append(os.path.join(root, fname).replace("\\", "/"))

          developer_tm_files.sort()
          has_human_tm = len(developer_tm_files) > 0

          # 2. Fetch active findings from DefectDojo
          findings = []
          next_url = f"{dd_url}/api/v2/findings/?product_name={repo_name}&active=true&limit=250"
          while next_url:
              req = urllib.request.Request(
                  next_url,
                  headers={"Authorization": f"Token {dd_token}"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      payload = json.loads(resp.read().decode())
                      findings.extend(payload.get("results", []))
                      next_url = payload.get("next")
              except Exception as exc:
                  print(f"Warning: Could not fetch DefectDojo findings: {exc}")
                  break

          # 3. Architectural Risk Themes with Threat Scenario, Attack Path & Root-Cause Grouping
          risk_catalog = {
              "transit-session": {
                  "triggered": False,
                  "highest_sev": "Medium",
                  "signal_count": 0,
                  "layer_counts": {},
                  "root_causes": {},
                  "finding_links": [],
                  "primary_cwe": None,
                  "primary_file": None,
                  "target_id": "flow-client-app",
                  "target_name": "External Requests (Data Flow)",
                  "stride": "Information Disclosure",
                  "title": "Unencrypted or Forged Client Session Transit",
                  "threat_scenario": (
                      "Threat Actor: External Network Attacker / Man-in-the-Middle.\n"
                      "Trust Boundary Crossed: Public Internet -> Application Entrypoint.\n"
                      "Scenario: Session cookies or HTTP requests traverse the public boundary without enforced TLS "
                      "transport flags or anti-CSRF validation, allowing session hijacking or forged state-changing actions."
                  ),
                  "attack_path": (
                      "1. Attacker intercepts unencrypted HTTP traffic or lures an authenticated user to a malicious page.\n"
                      "2. Because session cookies lack Secure/HttpOnly flags or endpoints lack CSRF tokens, the attacker "
                      "replays or forges authenticated requests.\n"
                      "3. Inspect underlying code-layer findings via the References links to harden cookie/middleware settings."
                  ),
                  "mitigation": (
                      "Enforce HTTPS/TLS 1.2+ with HSTS headers, set Secure/HttpOnly/SameSite=Strict on all "
                      "session cookies, and enforce anti-CSRF tokens on state-changing routes."
                  ),
                  "doc_keywords": ("tls", "https", "ssl", "cookie", "csrf", "session", "transit", "encryption")
              },
              "app-input-logic": {
                  "triggered": False,
                  "highest_sev": "Medium",
                  "signal_count": 0,
                  "layer_counts": {},
                  "root_causes": {},
                  "finding_links": [],
                  "primary_cwe": None,
                  "primary_file": None,
                  "target_id": "app-process",
                  "target_name": f"{repo_name} Application Service",
                  "stride": "Tampering",
                  "title": "Untrusted Input & Execution Boundary Exposure",
                  "threat_scenario": (
                      "Threat Actor: Unauthenticated or Authenticated External User.\n"
                      "Trust Boundary Crossed: External Client -> Application Request Handlers.\n"
                      "Scenario: User-controlled HTTP input reaches dangerous sinks (dynamic code execution, outbound URL "
                      "fetchers, HTML templates, or backtracking regexes) without strict schema validation."
                  ),
                  "attack_path": (
                      "1. Attacker sends crafted payloads in HTTP query parameters, JSON bodies, or form fields.\n"
                      "2. Application handlers pass the untrusted input directly into execution, SSRF, or regex sinks.\n"
                      "3. Depending on the sink, this enables arbitrary code execution, internal network probing (SSRF), "
                      "stored/reflected XSS, or CPU exhaustion (ReDoS)."
                  ),
                  "mitigation": (
                      "Enforce strict schema validation at API boundaries, context-aware output encoding, "
                      "outbound domain allowlists for SSRF protection, and safe linear-time regular expressions."
                  ),
                  "doc_keywords": ("input", "validation", "xss", "ssrf", "injection", "execution", "sanitiz", "tampering")
              },
              "data-persistence": {
                  "triggered": False,
                  "highest_sev": "Medium",
                  "signal_count": 0,
                  "layer_counts": {},
                  "root_causes": {},
                  "finding_links": [],
                  "primary_cwe": None,
                  "primary_file": None,
                  "target_id": "data-store",
                  "target_name": "Application Data Store",
                  "stride": "Elevation of Privilege",
                  "title": "Unparameterized Data Store Query Manipulation",
                  "threat_scenario": (
                      "Threat Actor: External Application User.\n"
                      "Trust Boundary Crossed: Application Service -> Persistent Database / NoSQL Store.\n"
                      "Scenario: Database or document queries incorporate raw user-supplied values directly into query "
                      "objects or SQL strings, allowing an attacker to alter query logic and bypass authorization."
                  ),
                  "attack_path": (
                      "1. Attacker submits operator-injected JSON objects (NoSQL) or SQL metacharacters via API inputs.\n"
                      "2. The data-access layer executes the manipulated query with the application's database privileges.\n"
                      "3. Attacker extracts sensitive records, modifies data, or escalates to administrative privileges."
                  ),
                  "mitigation": (
                      "Replace dynamic query construction with parameterized queries/prepared statements, "
                      "enforce strict primitive type casting before querying, and restrict DB credentials to least privilege."
                  ),
                  "doc_keywords": ("sql", "nosql", "database", "query", "parameterized", "store", "db", "persistence")
              },
              "secrets-supply-deps": {
                  "triggered": False,
                  "highest_sev": "Medium",
                  "signal_count": 0,
                  "layer_counts": {},
                  "root_causes": {},
                  "finding_links": [],
                  "primary_cwe": None,
                  "primary_file": None,
                  "target_id": "dep-store",
                  "target_name": "Dependencies & Secrets Store",
                  "stride": "Spoofing",
                  "title": "Exposed Credentials & Vulnerable Third-Party Components",
                  "threat_scenario": (
                      "Threat Actor: External Attacker / Repository Consumer.\n"
                      "Trust Boundary Crossed: Identity & Third-Party Supply Chain -> Application Core.\n"
                      "Scenario: Hardcoded private keys/credentials in the repository or known high-severity CVEs in "
                      "third-party packages allow attackers to impersonate services or exploit vulnerable library functions."
                  ),
                  "attack_path": (
                      "1. Attacker extracts hardcoded keys/certificates from source/artifacts or targets known CVEs in "
                      "exposed dependency parsers (e.g., body-parser, minimist, bson).\n"
                      "2. Exposed cryptographic keys enable TLS/token spoofing, while vulnerable packages allow prototype "
                      "pollution or remote code execution inside the app process."
                  ),
                  "mitigation": (
                      "Revoke and rotate exposed keys immediately, move secrets to an external vault/environment store, "
                      "and upgrade vulnerable third-party dependencies tracked in the CycloneDX SBOM."
                  ),
                  "doc_keywords": ("secret", "key", "token", "vault", "credential", "dependency", "package", "spoofing", "auth")
              },
              "container-infra": {
                  "triggered": False,
                  "highest_sev": "Medium",
                  "signal_count": 0,
                  "layer_counts": {},
                  "root_causes": {},
                  "finding_links": [],
                  "primary_cwe": None,
                  "primary_file": None,
                  "target_id": "infra-runtime",
                  "target_name": "Container & IaC Runtime",
                  "stride": "Elevation of Privilege",
                  "title": "Privileged Runtime & Unpatched Base Image Surface",
                  "threat_scenario": (
                      "Threat Actor: Attacker with Initial App Foothold.\n"
                      "Trust Boundary Crossed: Application Process -> Container OS & Host Infrastructure.\n"
                      "Scenario: Outdated OS base packages (OpenSSL, zlib, curl, Apache) or privileged container runtime "
                      "settings expand the blast radius if an application-layer flaw is exploited."
                  ),
                  "attack_path": (
                      "1. Attacker compromises an application endpoint or exploits an exposed network daemon.\n"
                      "2. Vulnerable OS libraries or root container permissions allow privilege escalation, local file "
                      "tampering, or service crashes inside the container."
                  ),
                  "mitigation": (
                      "Rebuild on minimal/distroless base images, enforce a non-root container user (USER nonroot), "
                      "mount the root filesystem read-only, and schedule automated image rebuilds."
                  ),
                  "doc_keywords": ("container", "docker", "root", "image", "runtime", "kubernetes", "iac", "base image")
              },
              "cicd-governance": {
                  "triggered": False,
                  "highest_sev": "Medium",
                  "signal_count": 0,
                  "layer_counts": {},
                  "root_causes": {},
                  "finding_links": [],
                  "primary_cwe": None,
                  "primary_file": None,
                  "target_id": "cicd-pipeline",
                  "target_name": "CI/CD & Supply Chain",
                  "stride": "Repudiation",
                  "title": "Unprotected Release Branches & Mutable Build Steps",
                  "threat_scenario": (
                      "Threat Actor: Compromised Maintainer Account / Malicious Upstream Dependency.\n"
                      "Trust Boundary Crossed: Source Control & CI/CD Pipeline -> Production Artifacts.\n"
                      "Scenario: Missing branch protection on the default branch, overly permissive workflow tokens, or "
                      "unpinned GitHub Actions allow unauthorized code merges or build pipeline tampering."
                  ),
                  "attack_path": (
                      "1. Direct pushes to the default branch bypass peer code review and security checks.\n"
                      "2. Workflows without explicit read-only top-level permissions or SHA-pinned actions can leak CI "
                      "secrets or execute modified third-party action tags."
                  ),
                  "mitigation": (
                      "Enable branch protection with required PR reviews on the default branch, pin all GitHub Actions "
                      "to full commit SHAs, and set top-level workflow permissions to 'contents: read'."
                  ),
                  "doc_keywords": ("ci/cd", "pipeline", "branch", "workflow", "pin", "github actions", "supply chain", "repudiation")
              },
          }

          sev_rank = {"Critical": 4, "High": 3, "Medium": 2, "Low": 1, "Info": 0}

          def mark_theme(theme_key, finding_obj):
              item = risk_catalog[theme_key]
              sev = finding_obj.get("severity", "Medium")
              svc = finding_obj.get("service") or "code-layer"
              fid = finding_obj.get("id")
              ftitle = (finding_obj.get("title") or "Finding").split(":")[0].strip()
              cwe = finding_obj.get("cwe")
              fpath = finding_obj.get("file_path") or finding_obj.get("component_name") or ""

              item["triggered"] = True
              item["signal_count"] += 1
              item["layer_counts"][svc] = item["layer_counts"].get(svc, 0) + 1

              if sev_rank.get(sev, 0) >= sev_rank.get(item["highest_sev"], 0):
                  item["highest_sev"] = sev
                  if cwe:
                      item["primary_cwe"] = cwe
                  if fpath and "no file" not in fpath.lower():
                      item["primary_file"] = fpath

              # Group identical rule titles so DefectDojo shows distinct root causes + counts
              rc_key = f"[{sev} | {svc}] {ftitle}"
              rc_entry = item["root_causes"].setdefault(rc_key, {"count": 0, "locations": set(), "sample_id": fid})
              rc_entry["count"] += 1
              if fpath and "no file" not in fpath.lower() and len(rc_entry["locations"]) < 3:
                  rc_entry["locations"].add(fpath)

              if fid and len(item["finding_links"]) < 10:
                  item["finding_links"].append((sev_rank.get(sev, 0), f"http://localhost:8080/finding/{fid} ({ftitle})"))

          for f in findings:
              svc = f.get("service") or "code-layer"
              if svc in ("threat-model-layer", "runtime-layer", "pentest-layer"):
                  continue
              sev = f.get("severity", "Medium")
              if sev == "Info":
                  continue

              cwe = f.get("cwe")
              title = (f.get("title") or "").lower()
              file_path = (f.get("file_path") or "").lower()

              if svc == "governance-posture":
                  mark_theme("cicd-governance", f)
              elif svc == "iac-cicd-layer":
                  if any(k in file_path for k in ("dockerfile", "docker-compose", ".tf", "k8s", "helm")):
                      mark_theme("container-infra", f)
                  else:
                      mark_theme("cicd-governance", f)
              elif svc == "container-layer":
                  mark_theme("container-infra", f)
              elif svc == "dependency-layer":
                  mark_theme("secrets-supply-deps", f)
              else:
                  if cwe in (319, 352, 614, 1275, 295) or any(k in title for k in ("cookie", "csrf", "tls", "ssl", "cors")):
                      mark_theme("transit-session", f)
                  elif cwe in (89, 943, 564) or any(k in title for k in ("sql", "nosql", "query", "database")):
                      mark_theme("data-persistence", f)
                  elif cwe in (287, 798, 306, 522, 259, 321) or any(k in title for k in ("secret", "token", "auth", "jwt", "password")):
                      mark_theme("secrets-supply-deps", f)
                  else:
                      mark_theme("app-input-logic", f)

          def format_dd_card(item, prefix_label):
              layers_str = ", ".join(f"{k}: {v}" for k, v in sorted(item["layer_counts"].items()))
              root_cause_lines = []
              for rc_label, info in sorted(item["root_causes"].items(), key=lambda x: -x[1]["count"])[:8]:
                  locs = f" -> Examples: {', '.join(sorted(info['locations']))}" if info["locations"] else ""
                  count_tag = f" ({info['count']} occurrences)" if info["count"] > 1 else ""
                  root_cause_lines.append(f"- {rc_label}{count_tag}{locs}")

              refs_text = "\n".join(r[1] for r in sorted(item["finding_links"], key=lambda x: -x[0]))
              primary_loc_note = f" (Primary: {item['primary_file']})" if item["primary_file"] else ""

              description = (
                  f"{item['threat_scenario']}\n\n"
                  f"**Correlated Layers ({item['signal_count']} total signals):** {layers_str}\n\n"
                  f"**Distinct Root Causes Identified:**\n" + "\n".join(root_cause_lines)
              )

              card = {
                  "title": f"[{prefix_label} | STRIDE: {item['stride']}] {item['title']}{primary_loc_note}",
                  "description": description,
                  "steps_to_reproduce": item["attack_path"],
                  "references": refs_text,
                  "severity": item["highest_sev"],
                  "mitigation": item["mitigation"],
                  "impact": f"Architectural {item['stride']} exposure on {item['target_name']} ({item['signal_count']} underlying signals).",
                  "component_name": item["target_name"],
                  "unique_id_from_tool": f"{prefix_label.lower().replace(' ', '-')}-{item['target_id']}-{item['stride'].lower().replace(' ', '-')}",
                  "vuln_id_from_tool": f"STRIDE-{item['stride']}",
                  "tags": ["threat-model", prefix_label.lower().replace(" ", "-"), "stride", item["stride"].lower().replace(" ", "-"), "nis2"]
              }
              if item["primary_cwe"]:
                  card["cwe"] = item["primary_cwe"]
              if item["primary_file"]:
                  card["file_path"] = item["primary_file"]
              return card

          dd_findings = []

          # =====================================================================
          # MODE B: Human-Authored Threat Model Detected (Multi-Tool Support)
          # =====================================================================
          if has_human_tm:
              print(f"Human-authored threat model detected: {developer_tm_files}")
              extracted_text = []
              tool_labels = set()

              for fpath in developer_tm_files:
                  ext = os.path.splitext(fpath)[1].lower()
                  if ext == ".json":
                      tool_labels.add("OWASP Threat Dragon")
                  elif ext == ".drawio":
                      tool_labels.add("Draw.io")
                  elif ext == ".md":
                      tool_labels.add("Markdown / Mermaid")
                  else:
                      tool_labels.add(f"Visual Diagram ({ext.lstrip('.').upper()})")

                  if ext in (".json", ".drawio", ".md", ".svg"):
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="ignore") as fh:
                              extracted_text.append(fh.read().lower())
                      except Exception:
                          pass

              corpus = "\n".join(extracted_text)
              tools_str = ", ".join(sorted(tool_labels))
              files_str = ", ".join(developer_tm_files)

              dd_findings.append({
                  "title": f"Human-Authored Threat Model Active ({tools_str})",
                  "description": (
                      f"Repository maintains an engineer-authored threat model ({files_str}). "
                      "Starter diagram generation was skipped to preserve architectural ownership."
                  ),
                  "severity": "Info",
                  "mitigation": "Keep threat model updated when adding new services, external integrations, or trust boundaries.",
                  "impact": "Satisfies continuous architectural risk analysis governance (NIS2).",
                  "component_name": "Architecture & Design",
                  "file_path": developer_tm_files[0],
                  "unique_id_from_tool": f"{repo_name}-human-tm-verified",
                  "vuln_id_from_tool": "NIS2-RISK-ANALYSIS",
                  "tags": ["threat-model", "human-authored", "nis2-compliant"]
              })

              if corpus.strip():
                  for key, item in risk_catalog.items():
                      if not item["triggered"]:
                          continue
                      if not any(kw in corpus for kw in item["doc_keywords"]):
                          dd_findings.append(format_dd_card(item, "Threat Model Gap"))

          # =====================================================================
          # MODE A: No Human Threat Model Yet -> Generate Clean Starter Blueprint
          # =====================================================================
          else:
              print("No human threat model found. Generating lightweight starter STRIDE blueprint...")

              has_db = risk_catalog["data-persistence"]["triggered"] or any(
                  f.lower().endswith(".sql") for _, _, files in os.walk(".") for f in files
              )
              has_infra = risk_catalog["container-infra"]["triggered"] or os.path.exists("Dockerfile")
              has_cicd = risk_catalog["cicd-governance"]["triggered"] or os.path.isdir(".github/workflows")

              def make_actor(cid, label, desc, x, y):
                  return {
                      "id": cid, "shape": "actor",
                      "position": {"x": x, "y": y}, "size": {"width": 150, "height": 80},
                      "attrs": {"text": {"text": label}},
                      "data": {"type": "tm.Actor", "name": label, "description": desc, "outOfScope": False, "hasOpenThreats": False, "threats": []}
                  }

              def make_process(cid, label, desc, x, y):
                  return {
                      "id": cid, "shape": "process",
                      "position": {"x": x, "y": y}, "size": {"width": 170, "height": 90},
                      "attrs": {"text": {"text": label}},
                      "data": {"type": "tm.Process", "name": label, "description": desc, "outOfScope": False, "hasOpenThreats": False, "threats": []}
                  }

              def make_store(cid, label, desc, x, y):
                  return {
                      "id": cid, "shape": "store",
                      "position": {"x": x, "y": y}, "size": {"width": 180, "height": 80},
                      "attrs": {"text": {"text": label}},
                      "data": {"type": "tm.Store", "name": label, "description": desc, "outOfScope": False, "hasOpenThreats": False, "threats": []}
                  }

              def make_flow(fid, label, src_id, dst_id, is_public=False, is_encrypted=True):
                  return {
                      "id": fid, "shape": "flow",
                      "source": {"cell": src_id}, "target": {"cell": dst_id},
                      "labels": [label],
                      "data": {
                          "type": "tm.Flow", "name": label,
                          "protocol": "HTTPS" if is_encrypted else "Internal",
                          "isEncrypted": is_encrypted, "isPublicNetwork": is_public,
                          "hasOpenThreats": False, "threats": []
                      }
                  }

              cells = [
                  {
                      "id": "trust-boundary-net",
                      "shape": "trust-boundary-box",
                      "position": {"x": 240, "y": 30},
                      "size": {"width": 720, "height": 490},
                      "attrs": {"text": {"text": f"{repo_name} Trusted Application & Runtime Boundary"}},
                      "data": {
                          "type": "tm.Boundary",
                          "name": f"{repo_name} Trusted Application & Runtime Boundary",
                          "description": "Auto-generated starter boundary. Replace with your own diagram in threat-model/ or threat-model.json."
                      }
                  },
                  make_actor("external-actor", "External Client / User", "Untrusted external user or API consumer.", 30, 140),
                  make_process("app-process", f"{repo_name}\nApplication Service", "Core application logic and API handlers.", 280, 135),
                  make_store("dep-store", "Dependencies & Secrets Store", "Third-party libraries and application credentials.", 540, 80),
                  make_flow("flow-client-app", "External Requests", "external-actor", "app-process", is_public=True, is_encrypted=True),
                  make_flow("flow-app-deps", "Package & Secret Access", "app-process", "dep-store", is_public=False, is_encrypted=False),
              ]

              if has_db:
                  cells.append(make_store("data-store", "Application Data Store", "Database schemas and persistent storage.", 760, 190))
                  cells.append(make_flow("flow-app-db", "Read / Write Queries", "app-process", "data-store", is_public=False, is_encrypted=False))

              if has_infra:
                  cells.append(make_process("infra-runtime", "Container & IaC Runtime", "Container image and infrastructure runtime.", 280, 360))
                  cells.append(make_flow("flow-app-infra", "Runs On / Provisioned By", "app-process", "infra-runtime", is_public=False, is_encrypted=False))

              if has_cicd:
                  cells.append(make_process("cicd-pipeline", "CI/CD & Supply Chain", "Automated build, test, and deployment pipelines.", 560, 360))
                  cells.append(make_flow("flow-cicd-app", "Build & Release", "cicd-pipeline", "app-process", is_public=False, is_encrypted=True))

              cells_by_id = {c["id"]: c for c in cells}

              for key, item in risk_catalog.items():
                  if not item["triggered"]:
                      continue
                  target_cell = cells_by_id.get(item["target_id"]) or cells_by_id["app-process"]
                  target_cell["data"]["hasOpenThreats"] = True
                  target_cell["data"]["threats"].append({
                      "id": f"arch-{key}",
                      "title": item["title"],
                      "status": "Open",
                      "severity": item["highest_sev"],
                      "type": item["stride"],
                      "description": item["threat_scenario"],
                      "mitigation": item["mitigation"]
                  })

                  dd_findings.append(format_dd_card(item, "Starter Blueprint"))

              model = {
                  "version": "2.2.0",
                  "summary": {
                      "title": f"{repo_name} Starter STRIDE Threat Model (Blueprint)",
                      "owner": "Security & Engineering",
                      "description": (
                          f"High-level starter threat model generated for {repo_name}. "
                          "Developers: refine this diagram in OWASP Threat Dragon and save as threat-model.json, "
                          "or commit your own diagrams (Draw.io, Mermaid/Markdown, Miro PNG/PDF) inside a threat-model/ folder."
                      )
                  },
                  "detail": {
                      "contributors": [],
                      "diagrams": [{
                          "id": 0,
                          "title": f"{repo_name} High-Level Architecture (STRIDE)",
                          "diagramType": "STRIDE",
                          "cells": cells
                      }]
                  }
              }

              out_file = f"{repo_name}-starter-threat-model.json"
              with open(out_file, "w", encoding="utf-8") as out:
                  json.dump(model, out, indent=2)
              print(f"Saved starter blueprint: {out_file}")

          with open("dd-threat-model-import.json", "w", encoding="utf-8") as dd_out:
              json.dump({"findings": dd_findings}, dd_out, indent=2)
          print(f"Prepared {len(dd_findings)} structured threat cards for DefectDojo.")
          EOF

      - name: Upload Starter Threat Dragon Blueprint Artifact (When No Human Model Exists)
        if: hashFiles('node-goat-starter-threat-model.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: node-goat-starter-threat-model
          path: 'node-goat-starter-threat-model.json'
          retention-days: 30

      - name: Import Threat Model Risk Summary to DefectDojo
        if: hashFiles('dd-threat-model-import.json') != ''
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Generic Findings Import" \
