name: Scheduled Security Scan (SonarQube, Semgrep, Trivy & DefectDojo)
on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    name: Full AppSec Suite & DefectDojo Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. SonarQube Cloud (Deep SAST) ---
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=capytainh
            -Dsonar.projectKey=CapyTainh_node-goat
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/test/**

      # --- 2. Semgrep Community Edition (Rule-based SAST) ---
      - name: Semgrep CE SAST Scan
        run: |
          pip install semgrep
          semgrep scan --config auto --json -o semgrep-results.json

      # --- 3. Trivy (SCA Dependencies & Hardcoded Secrets) ---
      - name: Trivy Filesystem & Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-results.json'

      # --- 4. Normalize & Import SonarQube Vulnerabilities (Tag: sast, sonarqube) ---
      - name: Export & Normalize SonarCloud Vulnerabilities
        run: |
          sleep 15
          API_URL="https://sonarcloud.io/api/issues/search?componentKeys=CapyTainh_node-goat&types=VULNERABILITY&resolved=false&ps=500"
          HTTP_CODE=$(curl -s -o sonar-raw.json -w "%{http_code}" "$API_URL")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "SonarCloud API failed with HTTP $HTTP_CODE:"
            cat sonar-raw.json
            exit 1
          fi

          python3 - << 'EOF'
          import json

          sev_map = {"BLOCKER": "Critical", "CRITICAL": "High", "MAJOR": "Medium", "MINOR": "Low", "INFO": "Info"}
          raw = json.load(open("sonar-raw.json"))
          findings = []

          for i in raw.get("issues", []):
              comp = i.get("component", "")
              file_path = comp.split(":", 1)[1] if ":" in comp else comp
              msg = i.get("message", "Vulnerability")
              rule = i.get("rule", "")
              tags = i.get("tags", [])

              cwe = None
              for t in tags:
                  if t.startswith("cwe-") and t[4:].isdigit():
                      cwe = int(t[4:])
                      break

              item = {
                  "title": f"[SonarQube] {msg[:200]}",
                  "description": f"**Scanner:** SonarQube Cloud (SAST)\n**Rule:** {rule}\n**Tags:** {', '.join(tags)}\n\n{msg}",
                  "severity": sev_map.get(i.get("severity", "MAJOR"), "Medium"),
                  "file_path": file_path,
                  "line": i.get("line", 1),
                  "active": True,
                  "tags": ["sast", "sonarqube"],
                  "unique_id_from_tool": i.get("key")
              }
              if cwe:
                  item["cwe"] = cwe
              findings.append(item)

          json.dump({"findings": findings}, open("sonar-dojo.json", "w"))
          print(f"Normalized {len(findings)} SonarQube vulnerabilities")
          EOF

          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Generic Findings Import" \
            -F "test_title=SonarQube SAST" \
            -F "tags=sast,sonarqube" \
            -F "file=@sonar-dojo.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      # --- 5. Import Semgrep Report (Tag: sast, semgrep) ---
      - name: Import Semgrep Report to DefectDojo
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "test_title=Semgrep CE SAST" \
            -F "tags=sast,semgrep" \
            -F "file=@semgrep-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      # --- 6. Import Trivy Report (Tag: sca, secrets, trivy) ---
      - name: Import Trivy Report to DefectDojo
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "test_title=Trivy SCA & Secrets" \
            -F "tags=sca,secrets,trivy" \
            -F "file=@trivy-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
