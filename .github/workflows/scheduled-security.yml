name: Scheduled Security Scan (CodeQL, Semgrep, Trivy & DefectDojo)
on:
  pull_request:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    name: Full AppSec Suite & DefectDojo Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      # --- 1. GitHub CodeQL (Uploads to GitHub Security/PRs & saves SARIF for DefectDojo) ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: true
          output: sarif-results

      # --- 2. Semgrep CE (Outputs JSON for DefectDojo & SARIF for GitHub Security/PRs in one pass) ---
      - name: Semgrep CE SAST Scan
        run: |
          pip install semgrep
          semgrep scan --config auto --json-output=semgrep-results.json --sarif-output=semgrep-results.sarif

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # --- 3. Trivy (Outputs JSON for DefectDojo & SARIF for GitHub Security/PRs) ---
      - name: Trivy JSON Scan (for DefectDojo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-results.json'

      - name: Trivy SARIF Scan (for GitHub Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # --- 4. Import CodeQL SARIF into DefectDojo (Skipped on Pull Requests) ---
      - name: Import CodeQL SARIF to DefectDojo
        if: github.event_name != 'pull_request'
        run: |
          SARIF_FILE=$(ls sarif-results/*.sarif | head -n 1)
          echo "Uploading $SARIF_FILE to DefectDojo..."
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "test_title=CodeQL SAST" \
            -F "tags=sast,codeql" \
            -F "file=@$SARIF_FILE" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      # --- 5. Import Semgrep Report into DefectDojo (Skipped on Pull Requests) ---
      - name: Import Semgrep Report to DefectDojo
        if: github.event_name != 'pull_request'
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "test_title=Semgrep CE SAST" \
            -F "tags=sast,semgrep" \
            -F "file=@semgrep-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      # --- 6. Import Trivy Report into DefectDojo (Skipped on Pull Requests) ---
      - name: Import Trivy Report to DefectDojo
        if: github.event_name != 'pull_request'
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "test_title=Trivy SCA & Secrets" \
            -F "tags=sca,secrets,trivy" \
            -F "file=@trivy-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
