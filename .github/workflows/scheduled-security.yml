name: Scheduled Security Scan (SAST, Trivy, Checkov, Scorecard & DefectDojo)
on:
  pull_request:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    name: Full AppSec, Container & Supply Chain Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # --- 1. GitHub CodeQL (Semantic SAST) ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: true
          output: sarif-results

      # --- 2. Trivy Filesystem (SCA, Secrets & CycloneDX SBOM) ---
      - name: Trivy Filesystem Scan (for DefectDojo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-results.json'

      - name: Trivy Filesystem SARIF (for GitHub Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Filesystem SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'node-goat-sbom.cdx.json'

      - name: Upload CycloneDX SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-goat-cyclonedx-sbom
          path: 'node-goat-sbom.cdx.json'
          retention-days: 30

      # --- 3. Container Image Scan (Runs automatically if a Dockerfile exists) ---
      - name: Check for Dockerfile
        id: check_docker
        run: |
          if [ -f "Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Local Container Image for Security Scan
        if: steps.check_docker.outputs.exists == 'true'
        continue-on-error: true
        run: docker build -t local-scan:ci .

      - name: Trivy Container Image Scan (for DefectDojo)
        if: steps.check_docker.outputs.exists == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'local-scan:ci'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-image-results.json'

      - name: Trivy Container Image SARIF (for GitHub Security)
        if: steps.check_docker.outputs.exists == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'local-scan:ci'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy Container SARIF to GitHub Security
        if: steps.check_docker.outputs.exists == 'true' && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # --- 4. Checkov (Dockerfiles, Terraform, Pulumi IaC & GitHub Workflows) ---
      - name: Checkov IaC, Dockerfile & CI/CD Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_format: sarif,json
          output_file_path: checkov-reports
          soft_fail: true

      - name: Upload Checkov SARIF to GitHub Security
        if: hashFiles('checkov-reports/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-reports/results_sarif.sarif
          category: checkov

      # --- 5. OpenSSF Scorecard (CI/CD Top 10 & Supply Chain Posture) ---
      - name: OpenSSF Scorecard Analysis
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload OpenSSF Scorecard SARIF to GitHub Security
        if: github.event_name != 'pull_request' && hashFiles('scorecard-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard

      # --- 6. Sync All Results to DefectDojo (Skipped on Pull Requests) ---
      - name: Import CodeQL SARIF to DefectDojo
        if: github.event_name != 'pull_request'
        run: |
          SARIF_FILE=$(ls sarif-results/*.sarif | head -n 1)
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "test_title=CodeQL SAST" \
            -F "tags=sast,codeql" \
            -F "file=@$SARIF_FILE" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      - name: Import Trivy Filesystem Report to DefectDojo
        if: github.event_name != 'pull_request'
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "test_title=Trivy SCA & Secrets" \
            -F "tags=sca,secrets,trivy" \
            -F "file=@trivy-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      - name: Import Trivy Container Image Report to DefectDojo
        if: github.event_name != 'pull_request' && hashFiles('trivy-image-results.json') != ''
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "test_title=Trivy Container Image" \
            -F "tags=container,trivy" \
            -F "file=@trivy-image-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      - name: Import Checkov IaC & CI/CD Report to DefectDojo
        if: github.event_name != 'pull_request' && hashFiles('checkov-reports/results_json.json') != ''
        run: |
          if [ -s "checkov-reports/results_json.json" ]; then
            curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "scan_type=Checkov Scan" \
              -F "test_title=Checkov IaC & CI/CD" \
              -F "tags=iac,cicd,checkov" \
              -F "file=@checkov-reports/results_json.json" \
              -F "product_name=node-goat" \
              -F "product_type_name=GitHub Repositories" \
              -F "engagement_name=Scheduled CI Scans" \
              -F "auto_create_context=true" \
              -F "close_old_findings=true"
          else
            echo "Checkov JSON report is empty; skipping upload."
          fi

      - name: Import OpenSSF Scorecard Report to DefectDojo
        if: github.event_name != 'pull_request' && hashFiles('scorecard-results.sarif') != ''
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=SARIF" \
            -F "test_title=OpenSSF Scorecard" \
            -F "tags=cicd,scorecard,spvs" \
            -F "file=@scorecard-results.sarif" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
