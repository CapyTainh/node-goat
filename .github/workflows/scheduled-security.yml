name: Scheduled Security Scan (SonarQube, Semgrep, Trivy & DefectDojo)
on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  security-scan:
    name: Full AppSec Suite & DefectDojo Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 1. SonarQube Cloud (Deep SAST) ---
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=capytainh
            -Dsonar.projectKey=CapyTainh_node-goat
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/test/**

      # --- 2. Semgrep Community Edition (Rule-based SAST) ---
      - name: Semgrep CE SAST Scan
        run: |
          pip install semgrep
          semgrep scan --config auto --json -o semgrep-results.json

      # --- 3. Trivy (SCA Dependencies & Hardcoded Secrets) ---
      - name: Trivy Filesystem & Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-results.json'

      # --- 4. Export, Enrich & Import SonarQube Vulnerabilities (Tag: sast, sonarqube) ---
      - name: Export & Normalize SonarCloud Vulnerabilities
        run: |
          sleep 15
          API_URL="https://sonarcloud.io/api/issues/search?componentKeys=CapyTainh_node-goat&types=VULNERABILITY&resolved=false&ps=500"
          HTTP_CODE=$(curl -s -o sonar-raw.json -w "%{http_code}" "$API_URL")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "SonarCloud API failed with HTTP $HTTP_CODE:"
            cat sonar-raw.json
            exit 1
          fi

          python3 - << 'EOF'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request

          def clean_html(raw_html):
              if not raw_html:
                  return ""
              text = re.sub(r"<br\s*/?>|</p>|</li>|</h[1-6]>", "\n", raw_html)
              text = re.sub(r"<[^>]+>", "", text)
              text = html.unescape(text)
              return re.sub(r"\n{3,}", "\n\n", text).strip()

          rule_cache = {}

          def get_rule_details(rule_key):
              if rule_key in rule_cache:
                  return rule_cache[rule_key]
              info = {"cwe": None, "mitigation": "", "impact": "", "references": ""}
              try:
                  url = f"https://sonarcloud.io/api/rules/show?key={urllib.parse.quote(rule_key)}"
                  with urllib.request.urlopen(url, timeout=10) as resp:
                      rule = json.loads(resp.read().decode()).get("rule", {})

                  for std in rule.get("securityStandards", []):
                      if std.startswith("cwe:"):
                          cwe_num = std.split(":", 1)[1]
                          if cwe_num.isdigit():
                              info["cwe"] = int(cwe_num)
                              break

                  sections = {s.get("key"): clean_html(s.get("content", "")) for s in rule.get("descriptionSections", [])}
                  info["impact"] = sections.get("root_cause") or clean_html(rule.get("htmlDesc", ""))[:1500]
                  info["mitigation"] = sections.get("how_to_fix", "")
                  refs = sections.get("resources", "")
                  rule_slug = rule_key.split(":", 1)[1] if ":" in rule_key else rule_key
                  sonar_url = f"https://rules.sonarsource.com/search/?search={rule_slug}"
                  info["references"] = f"{refs}\n\nSonarSource Rule Reference: {sonar_url}".strip()
              except Exception as e:
                  print(f"Warning: could not fetch rule {rule_key}: {e}")

              rule_cache[rule_key] = info
              return info

          sev_map = {"BLOCKER": "Critical", "CRITICAL": "High", "MAJOR": "Medium", "MINOR": "Low", "INFO": "Info"}
          raw = json.load(open("sonar-raw.json"))
          findings = []

          for i in raw.get("issues", []):
              comp = i.get("component", "")
              file_path = comp.split(":", 1)[1] if ":" in comp else comp
              msg = i.get("message", "Vulnerability")
              rule = i.get("rule", "")
              rule_info = get_rule_details(rule) if rule else {}

              item = {
                  "title": f"[SonarQube] {msg[:200]}",
                  "description": f"**Scanner:** SonarQube Cloud (SAST)\n**Rule:** {rule}\n**File:** {file_path}\n\n{msg}",
                  "severity": sev_map.get(i.get("severity", "MAJOR"), "Medium"),
                  "file_path": file_path,
                  "line": i.get("line", 1),
                  "active": True,
                  "tags": ["sast", "sonarqube"],
                  "unique_id_from_tool": i.get("key")
              }
              if rule_info.get("cwe"):
                  item["cwe"] = rule_info["cwe"]
              if rule_info.get("mitigation"):
                  item["mitigation"] = rule_info["mitigation"]
              if rule_info.get("impact"):
                  item["impact"] = rule_info["impact"]
              if rule_info.get("references"):
                  item["references"] = rule_info["references"]

              findings.append(item)

          json.dump({"findings": findings}, open("sonar-dojo.json", "w"))
          print(f"Enriched and normalized {len(findings)} SonarQube vulnerabilities")
          EOF

          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Generic Findings Import" \
            -F "test_title=SonarQube SAST" \
            -F "tags=sast,sonarqube" \
            -F "file=@sonar-dojo.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      # --- 5. Import Semgrep Report (Tag: sast, semgrep) ---
      - name: Import Semgrep Report to DefectDojo
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "test_title=Semgrep CE SAST" \
            -F "tags=sast,semgrep" \
            -F "file=@semgrep-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"

      # --- 6. Import Trivy Report (Tag: sca, secrets, trivy) ---
      - name: Import Trivy Report to DefectDojo
        run: |
          curl -i --fail-with-body -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/reimport-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "test_title=Trivy SCA & Secrets" \
            -F "tags=sca,secrets,trivy" \
            -F "file=@trivy-results.json" \
            -F "product_name=node-goat" \
            -F "product_type_name=GitHub Repositories" \
            -F "engagement_name=Scheduled CI Scans" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
